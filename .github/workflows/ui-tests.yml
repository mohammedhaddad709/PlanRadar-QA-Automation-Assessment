name: UI tests (Selenium + TestNG)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Credentials come from repository secrets (Settings > Secrets and variables > Actions).
      # Chrome is pre-installed on the runner; Selenium Manager resolves the matching driver.
      - name: Run tests (headless Chrome)
        env:
          PLANRADAR_EMAIL: ${{ secrets.PLANRADAR_EMAIL }}
          PLANRADAR_PASSWORD: ${{ secrets.PLANRADAR_PASSWORD }}
        run: mvn -B test -Drun.mode=fast

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/execution-summary.md
            target/surefire-reports/
            target/screenshots/
            target/allure-results/
            target/logs/
