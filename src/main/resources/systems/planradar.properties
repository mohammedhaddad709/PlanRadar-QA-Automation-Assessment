# PlanRadar profile (namespaced keys, read by PlanRadarConfig). Every key can be overridden: -D<key>=<value>
# Credentials are NOT here: see config/credentials.example.properties and test-data/planradar/login-data.json.

# ---- target application ----
planradar.baseUrl=https://www.planradar.com
planradar.login.path=/login/

# Existing project the generated form is assigned to, and the folder/plan selected as ticket Location
# (leave the location empty for a project that does not require one).
planradar.project.name=QA Assessment - Form Builder
planradar.ticket.location=QA Testing Location

# Prefix of every artifact the suite creates (forms, tickets); each run adds its own run id.
planradar.artifact.prefix=QA_Assessment
