# Browser defaults; every key can be overridden with -D<key>=<value>.

# chrome | edge | firefox
browser=chrome
# Local | LocalHeadless | Remote (Selenium Grid). -Dheadless=true is the same as executionType=LocalHeadless.
# run.mode=fast switches the default to LocalHeadless unless -Dheadless / -DexecutionType is given explicitly.
executionType=Local
headless=false

# run.mode=demo only: pause after each click / type / select / hover, and outline the element before acting on it.
demo.step.delay.ms=800
demo.highlight=true

# Selenium Grid (executionType=Remote)
remoteHost=localhost
remotePort=4444
